name: Runtime comparison (Node vs Bun)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.js'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/runtime-benchmark.yml'

permissions:
  contents: read

jobs:
  runtime:
    name: "${{ matrix.runtime }} app smoke + tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            version: '26'
          - runtime: bun
            version: '1.4.2'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete test suite (Node)
        if: matrix.runtime == 'node'
        run: npm test
      - name: Run complete test suite (Bun)
        if: matrix.runtime == 'bun'
        run: bun test
      - name: Start the real application and measure resident memory
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          NODE_ENV: test
          PORT: '18765'
          DASHBOARD_PASSWORD: runtime-benchmark-only
          DASHBOARD_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          if [ "$RUNTIME" = "node" ]; then
            npm start > runtime.log 2>&1 &
          else
            bun index.js > runtime.log 2>&1 &
          fi
          APP_PID=$!
          cleanup() {
            kill -TERM "$APP_PID" 2>/dev/null || true
            for _ in $(seq 1 10); do
              kill -0 "$APP_PID" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/health > health.json; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat runtime.log
            echo "Application did not become healthy"
            exit 1
          fi
          PEAK_RSS_KB=0
          for SAMPLE in $(seq 1 12); do
            sleep 5
            RSS_KB=$(ps -o rss= -p "$APP_PID" | tr -d ' ')
            if [ -z "$RSS_KB" ]; then
              cat runtime.log
              echo "Application exited during the memory soak"
              exit 1
            fi
            if [ "$RSS_KB" -gt "$PEAK_RSS_KB" ]; then PEAK_RSS_KB=$RSS_KB; fi
          done
          echo "Runtime: $RUNTIME"
          echo "Health: $(cat health.json)"
          echo "Peak application RSS over 60s: $((PEAK_RSS_KB / 1024)) MiB"
          if [ "$PEAK_RSS_KB" -gt $((256 * 1024)) ]; then
            cat runtime.log
            echo "Application exceeded the 256 MiB memory budget"
            exit 1
          fi
          echo "---- application logs ----"
          cat runtime.log
