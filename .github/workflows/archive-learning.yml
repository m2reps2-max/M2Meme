name: MEME RADAR cold archive learning

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 */2 * *'

permissions:
  contents: read

concurrency:
  group: meme-radar-cold-archive-learning
  cancel-in-progress: false

jobs:
  archive-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEME_RADAR_INGEST_URL: https://m2meme.fadehost.app/internal/actions/archive-learning
      MEME_RADAR_ACTIONS_TOKEN: ${{ secrets.MEME_RADAR_ACTIONS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip safely when the shared secret is not configured
        if: env.MEME_RADAR_ACTIONS_TOKEN == ''
        run: echo "::notice::Archive learning skipped. Configure MEME_RADAR_ACTIONS_TOKEN in GitHub Actions and FadeHost to enable it."

      - name: Analyze cold SQLite archive outside FadeHost
        if: env.MEME_RADAR_ACTIONS_TOKEN != ''
        run: node scripts/run-actions-archive-learning.js

      - name: Preserve archive learning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-radar-cold-archive-learning
          path: artifacts/archive-learning.json
          if-no-files-found: ignore
          retention-days: 30
